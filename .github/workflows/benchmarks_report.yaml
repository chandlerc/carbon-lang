# Uploads validated pull request benchmark artifacts to Bencher and archives
# closed pull request branches.
#
# Because `benchmarks.yaml` runs untrusted code on `pull_request` (including
# from forks) without write permissions or `BENCHER_API_KEY`, this separate
# workflow runs from `trunk` to validate the data-only BMF JSON artifacts and
# upload them to Bencher. Neither job ever checks out or executes PR code.
# Both triggers run from the workflow file on `trunk`; changes to this file only
# take effect once merged to `trunk`.
name: Report PR Benchmarks

on:
  # zizmor: ignore[dangerous-triggers] - {validates JSON artifacts only; never executes PR code}
  workflow_run:
    workflows: [Benchmarks]
    types:
      - completed
  # zizmor: ignore[dangerous-triggers] - {archives closed PR branches without checking out PR code}
  pull_request_target:
    types:
      - closed

permissions: {}

jobs:
  report-pr:
    name: Upload PR benchmarks to Bencher
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    # Share a non-canceling group per `<owner>:<branch>` with `archive-closed-pr`
    # so closing/merging a PR right as `Benchmarks` finishes cannot race with
    # uploading and orphan an unarchived `pr-<N>` branch.
    concurrency:
      group: >-
        bencher-pr-${{ (github.event.workflow_run.head_repository.owner.login &&
         format('{0}:{1}',
           github.event.workflow_run.head_repository.owner.login,
           github.event.workflow_run.head_branch)) ||
        github.run_id }}
      cancel-in-progress: false
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Intentionally omit `checks: write`: Bencher marks GitHub Check Runs as
    # `failure` on any alert even without `--error-on-alert`, whereas omitting
    # `checks: write` keeps PR alerts strictly non-blocking sticky comments.
    permissions:
      actions: read # To download BMF artifacts from the Benchmarks run.
      contents: read # For actions/checkout of trunk.
      pull-requests: write # For non-blocking Bencher alert comments on PRs.
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: block
          # prettier-ignore
          allowed-endpoints: >
            *.blob.storage.azure.net:443
            api.bencher.dev:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443

      - name: Check pull request and artifacts
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_OWNER:
            ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          artifacts_status="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '
              [.artifacts[] | select(.name | startswith("bencher-bmf-"))] as $bmf
              | if ($bmf | length) == 0 then "none"
                elif all($bmf[];
                  (.name == "bencher-bmf-ubuntu-22.04" or
                   .name == "bencher-bmf-ubuntu-22.04-arm")
                  and .size_in_bytes <= 1048576
                ) then "ok"
                else "invalid" end
            ')"
          if [[ "$artifacts_status" == "invalid" ]]; then
            echo "::error::Unexpected or oversized bencher-bmf-* artifact on run $RUN_ID."
            exit 1
          fi
          if [[ "$artifacts_status" != "ok" || -z "$HEAD_OWNER" || -z "$HEAD_BRANCH" ]]; then
            echo "Run $RUN_ID produced no BMF artifacts; skipping."
            exit 0
          fi

          pr_info="$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open \
            -f base=trunk \
            -f "head=${HEAD_OWNER}:${HEAD_BRANCH}" \
            --jq 'map(select(.head.sha == env.HEAD_SHA))[0] | select(.) | "\(.number) \(.base.sha)"')"
          if [[ -z "$pr_info" ]]; then
            echo "No open PR targeting trunk at $HEAD_OWNER:$HEAD_BRANCH ($HEAD_SHA); skipping."
            exit 0
          fi

          read -r pr_number pr_base_sha <<<"$pr_info"
          if [[ ! "$pr_number" =~ ^[0-9]+$ || ! "$pr_base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected PR metadata: $pr_info"
            exit 1
          fi
          {
            echo "should_report=true"
            echo "pr_number=$pr_number"
            echo "base_sha=$pr_base_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout trunk
        if: steps.check-pr.outputs.should_report == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download BMF artifacts
        if: steps.check-pr.outputs.should_report == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bencher-bmf-*
          path: ${{ runner.temp }}/bmf-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install Bencher CLI
        if: steps.check-pr.outputs.should_report == 'true'
        uses: bencherdev/bencher@7de3c69a85380826613050826b4bce062be2f07d # v0.6.16

      - name: Validate and upload PR reports to Bencher
        if: steps.check-pr.outputs.should_report == 'true'
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/bmf-artifacts
          BASE_SHA: ${{ steps.check-pr.outputs.base_sha }}
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ steps.check-pr.outputs.pr_number }}
        run: |
          threshold_output="$(python3 ./toolchain/benchmarking/run_bencher.py threshold-args --mode=pr)"
          threshold_args=()
          while IFS= read -r arg; do
            [[ -n "$arg" ]] && threshold_args+=("$arg")
          done <<<"$threshold_output"

          # Explicit testbed allowlist matching `benchmarks.yaml`'s `continuous`
          # runner matrix so untrusted PRs cannot create arbitrary testbeds.
          # Validate every present BMF file before uploading any of them.
          artifact_root="$(realpath -- "$ARTIFACT_DIR")"
          runners_to_upload=()
          for runner in ubuntu-22.04 ubuntu-22.04-arm; do
            bmf_file="$ARTIFACT_DIR/bencher-bmf-$runner/bmf-$runner.json"
            if [[ ! -f "$bmf_file" ]]; then
              continue
            fi
            resolved="$(realpath -- "$bmf_file")"
            if [[ "$resolved" != "$artifact_root/"* ]]; then
              echo "::error::Artifact path escaped $artifact_root: $bmf_file"
              exit 1
            fi
            python3 ./toolchain/benchmarking/run_bencher.py validate "$bmf_file"
            runners_to_upload+=("$runner")
          done

          if [[ "${#runners_to_upload[@]}" -eq 0 ]]; then
            echo "::error::Expected validated BMF files in $ARTIFACT_DIR, found none."
            exit 1
          fi

          archived="$(bencher branch list carbon-lang \
            --archived \
            --name "pr-$PR_NUMBER" \
            --attempts 3)"
          if [[ "$(jq 'length' <<<"$archived")" -gt 0 ]]; then
            bencher unarchive \
              --project carbon-lang \
              --branch "pr-$PR_NUMBER" \
              --attempts 3
          fi

          for runner in "${runners_to_upload[@]}"; do
            bmf_file="$ARTIFACT_DIR/bencher-bmf-$runner/bmf-$runner.json"
            bencher run \
              --project carbon-lang \
              --branch "pr-$PR_NUMBER" \
              --hash "$HEAD_SHA" \
              --testbed "$runner" \
              --start-point trunk \
              --start-point-hash "$BASE_SHA" \
              --start-point-reset \
              --thresholds-reset \
              --github-actions "$GITHUB_TOKEN" \
              --ci-id "$runner" \
              --ci-number "$PR_NUMBER" \
              --ci-public-links \
              --ci-only-on-alert \
              --adapter json \
              --file "$bmf_file" \
              "${threshold_args[@]}"
          done

  archive-closed-pr:
    name: Archive closed PR branch in Bencher
    if:
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.base.ref == 'trunk'
    concurrency:
      group: >-
        bencher-pr-${{ github.event.pull_request.head.user.login }}:${{
        github.event.pull_request.head.ref }}
      cancel-in-progress: false
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: block
          # prettier-ignore
          allowed-endpoints: >
            api.bencher.dev:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Install Bencher CLI
        uses: bencherdev/bencher@7de3c69a85380826613050826b4bce062be2f07d # v0.6.16

      - name: Archive Bencher PR branch
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number: $PR_NUMBER"
            exit 1
          fi
          branches="$(bencher branch list carbon-lang \
            --name "pr-$PR_NUMBER" \
            --attempts 3)"
          if [[ "$(jq 'length' <<<"$branches")" -eq 0 ]]; then
            echo "Active branch pr-$PR_NUMBER not present in Bencher; nothing to archive."
            exit 0
          fi
          bencher archive \
            --project carbon-lang \
            --branch "pr-$PR_NUMBER" \
            --attempts 3
